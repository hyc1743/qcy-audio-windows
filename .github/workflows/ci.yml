name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend:
    name: Frontend (Typecheck, Test, Build)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test

      - name: Production build
        run: npm run build

  rust-and-tauri:
    name: Rust Workspace & Windows MSVC Tauri Build
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Setup Rust (MSVC)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Build frontend dist
        run: |
          npm ci
          npm run build

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Rust tests
        run: cargo test --workspace

      - name: Tauri MSVC release build check
        run: npm run tauri -- build --bundles nsis

      - name: Verify embedded frontend (--smoke-test)
        shell: pwsh
        run: |
          $out = [System.IO.Path]::GetTempFileName()
          $err = [System.IO.Path]::GetTempFileName()
          $p = Start-Process -FilePath "target\release\qcy-desktop.exe" -ArgumentList "--smoke-test" -Wait -PassThru `
            -RedirectStandardOutput $out -RedirectStandardError $err
          $stdout = Get-Content -Raw $out -ErrorAction SilentlyContinue
          $stderr = Get-Content -Raw $err -ErrorAction SilentlyContinue
          if ($stdout) { Write-Host $stdout }
          if ($stderr) { Write-Host $stderr }
          Remove-Item -Force -ErrorAction SilentlyContinue $out, $err
          if ($p.ExitCode -ne 0) { throw "smoke-test exited with $($p.ExitCode)" }
          if ($stdout -notmatch "SMOKE_TEST_OK:" -or $stdout -match "localhost:1420" -or $stdout -notmatch "dev_build=false" -or $stdout -notmatch "index_has_script=true") {
            throw "smoke-test did not verify embedded custom-protocol assets"
          }

      - name: Upload Windows installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: qcy-desktop-windows-x64
          path: |
            target/release/qcy-desktop.exe
            target/release/bundle/nsis/*.exe
          if-no-files-found: warn
