name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows-release:
    name: Build Windows x64 Release (MSVC Portable + NSIS)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Setup Rust (MSVC)
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Install frontend dependencies & verify
        run: |
          npm ci
          npm run typecheck
          npm run test
          npm run build

      - name: Run Rust workspace tests
        run: cargo test --workspace

      - name: Build Tauri NSIS installer & release binary (MSVC)
        run: npm run tauri -- build --bundles nsis

      - name: Package Portable ZIP & SHA256SUMS
        shell: pwsh
        run: |
          .\scripts\package-portable.ps1 -Profile release -OutDir dist-portable
          $releaseAssets = New-Item -ItemType Directory -Force -Path release-assets
          Copy-Item "dist-portable\qcy-desktop-windows-x64-portable.zip" -Destination $releaseAssets
          Get-ChildItem "target\release\bundle\nsis\*.exe" | Copy-Item -Destination $releaseAssets

          $lines = Get-ChildItem $releaseAssets -File | Sort-Object Name | ForEach-Object {
            $h = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$h  $($_.Name)"
          }
          $lines | Out-File -Encoding ascii -FilePath (Join-Path $releaseAssets "SHA256SUMS.txt")
          Get-Content (Join-Path $releaseAssets "SHA256SUMS.txt")

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release-assets/*
