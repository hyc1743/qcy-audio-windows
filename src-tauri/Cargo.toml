[package]
name = "qcy-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Clean-room Windows desktop companion app for QCY audio devices"

[lib]
name = "qcy_desktop_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
qcy-core.workspace = true
qcy-models.workspace = true
qcy-transport.workspace = true
serde.workspace = true
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tokio.workspace = true

[features]
# Embeds `../dist` and serves it via Tauri's custom protocol (`http://tauri.localhost/`).
# Enabled automatically by `npm run tauri -- build`, or manually via
# `cargo build --release -p qcy-desktop --features custom-protocol`.
custom-protocol = ["tauri/custom-protocol"]
